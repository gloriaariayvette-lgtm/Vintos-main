# Board 1, in the bathroom by the shower: steam sensor + little speaker (Gloria, 8 November).
#   Steam sensor  VCC 3V3, GND, SIGNAL GPIO34 (analog in)
#   Speaker amp   red 5V, black GND, white GPIO25 (the ESP32's own DAC)
# His voice and his songs play on that amp from a URL (a WAV, 16 kHz mono), through shower_dac.h: copy it into the
# same folder as this file. ESPHome itself no longer drives the built-in DAC for audio; shower_dac.h does.
# Everything here only counts when her phone is within 1 m of the board (Gloria: "otherwise it could be some other
# person"). The phone is found by its IRK, as the kitchen and bedroom boards find it; the key is gloria_phone_irk in
# the ESPHome add-on's secrets.yaml, never in this file. Away from her: the board reports nothing and starts nothing.
# Keep the board, amp and speaker out of the spray; only the sensor pad goes where the steam is.
esphome:
  name: house-steam
  friendly_name: House steam board
  on_boot:
    priority: 600
    then:
      - lambda: 'shower_dac::mute_idle();'
  project:
    name: vintos.house-speaker
    version: "2026.11.18-owner-audio-r1"
  includes:
    - shower_dac.h
    - wav_pcm.h
    - steam_signal.h
    - owner_audio_window.h

external_components:
  - source:
      type: local
      path: components
    components: [speaker_streaming]

speaker_streaming:

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      include_builtin_idf_components:   # the DAC driver and the HTTP client, for shower_dac.h
        - esp_driver_dac
        - esp_http_client

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "House Steam Board"

captive_portal:

api:
  encryption:
    key: !secret house_steam_api_key
  actions:
    - action: arm_owner_audio_test
      then:
        - lambda: 'id(owner_audio_window).arm(millis());'

ota:
  - platform: esphome

logger:

mqtt:
  id: mqtt_client
  broker: 192.168.1.91
  idf_send_async: true
  discovery: false
  reboot_timeout: 0s
  on_message:
    # He plays something here: the URL of a WAV, his voice or one of his songs. Only with her near.
    - topic: vintos/board/house-steam/play
      then:
        - if:
            condition:
              lambda: 'return id(owner_audio_window).allows(id(shower_active).state, id(gloria_near).state, millis());'
            then:
              - lambda: 'shower_dac::play(x, id(speaker_volume).state / 100.0f);'
    - topic: vintos/board/house-steam/stop
      then:
        - lambda: 'shower_dac::stop();'

esp32_ble_tracker:
  scan_parameters:
    active: false

globals:
  - id: owner_audio_window
    type: house_steam::OwnerAudioWindow
    restore_value: false
  - id: steam_state
    type: int
    initial_value: "-1"
  - id: steam_voltage
    type: float
    initial_value: "NAN"
  - id: near_until
    type: uint32_t
    initial_value: '0'
  - id: was_busy
    type: bool
    initial_value: 'false'

text_sensor:
  - platform: template
    name: "Audio output mode"
    entity_category: diagnostic
    update_interval: 1s
    lambda: 'return std::string(shower_dac::idle_muted() ? "grounded idle" : "active DAC");'
  - platform: template
    name: "Board reset reason"
    entity_category: diagnostic
    update_interval: 10s
    lambda: 'return std::to_string(int(esp_reset_reason()));'
  - platform: template
    name: "Audio network mode"
    entity_category: diagnostic
    update_interval: 1s
    lambda: |-
      wifi_ps_type_t mode;
      if (esp_wifi_get_ps(&mode) != ESP_OK) return std::string("unknown");
      return std::string(mode == WIFI_PS_NONE ? "low latency" : "normal");
  - platform: template
    name: "Speaker playback"
    entity_category: diagnostic
    update_interval: 1s
    lambda: 'return std::string(shower_dac::status());'

number:
  - platform: template
    id: speaker_volume
    name: "Speaker volume"
    optimistic: true
    min_value: 0
    max_value: 100
    step: 1
    initial_value: 100
    restore_value: true
    unit_of_measurement: "%"
  - platform: template     # her phone's signal at 1 m from this board; set from a real reading, no reflash needed
    id: rssi_at_1m
    name: "Gloria phone signal at 1 m"
    optimistic: true
    min_value: -100
    max_value: -30
    step: 1
    initial_value: -65
    restore_value: true
    unit_of_measurement: dBm
  - platform: template     # steam reading (0-100) above which it counts as steam; set from a real shower
    id: steam_threshold
    name: "Steam threshold"
    optimistic: true
    min_value: 3
    max_value: 100
    step: 1
    initial_value: 30
    restore_value: true

interval:
  - interval: 2s
    then:
      - if:
          condition:
            binary_sensor.is_on: gloria_near
          then:
            - mqtt.publish_json:
                topic: vintos/board/house-steam/diagnostic
                payload: |-
                  root["revision"] = "owner-audio-r1";
                  root["owner_audio_test_armed"] = id(owner_audio_window).active(millis());
                  root["uptime_ms"] = millis();
                  root["reset_reason"] = int(esp_reset_reason());
                  root["idle_muted"] = shower_dac::idle_muted();
                  root["signal_pin"] = gpio_get_level(GPIO_NUM_25);
                  root["heap_free"] = esp_get_free_heap_size();
                  root["heap_low_water"] = esp_get_minimum_free_heap_size();
                  root["largest_free_block"] = heap_caps_get_largest_free_block(MALLOC_CAP_8BIT);
                  root["gpio34_v"] = id(steam_voltage);
                  root["filtered_wetness"] = id(steam_raw).state;
                  root["steam_state"] = id(steam_state);
  # tells house_boards.py when the speaker is free, so the next song can go
  - interval: 1s
    then:
      - lambda: |-
          id(owner_audio_window).expire(millis());
          if (shower_dac::busy() && !id(owner_audio_window).allows(id(shower_active).state, id(gloria_near).state, millis())) {
            shower_dac::stop();
          }
          bool b = shower_dac::busy();
          if (b != id(was_busy)) {
            id(was_busy) = b;
            id(mqtt_client).publish("vintos/board/house-steam/player", b ? "busy" : "idle");
          }

sensor:
  - platform: template
    name: "Steam signal voltage"
    entity_category: diagnostic
    unit_of_measurement: V
    accuracy_decimals: 3
    update_interval: 2s
    lambda: 'return id(steam_voltage);'
  - platform: template
    name: "Steam signal level"
    entity_category: diagnostic
    accuracy_decimals: 2
    update_interval: 2s
    lambda: 'return id(steam_raw).state;'
  - platform: template
    name: "Audio free memory"
    entity_category: diagnostic
    unit_of_measurement: B
    accuracy_decimals: 0
    update_interval: 5s
    lambda: 'return esp_get_free_heap_size();'

  - platform: ble_rssi
    irk: !secret gloria_phone_irk
    id: gloria_phone_rssi
    name: "Gloria phone signal"
    filters:
      - median:
          window_size: 3
          send_every: 1
    on_value:
      then:
        - lambda: |-
            float d = pow(10.0f, (id(rssi_at_1m).state - x) / 25.0f);
            if (d <= 1.0f) id(near_until) = millis() + 15000;
        - if:
            condition:
              binary_sensor.is_on: shower_active
            then:
            - mqtt.publish_json:
                topic: espresense/devices/gloria-phone/house-steam
                payload: |-
                  root["id"] = "gloria-phone";
                  root["rssi"] = x;
                  root["rssi@1m"] = id(rssi_at_1m).state;
                  root["distance"] = pow(10.0f, (id(rssi_at_1m).state - x) / 25.0f);

  - platform: adc
    pin: GPIO34
    id: steam_raw
    attenuation: 12db
    samples: 32
    sampling_mode: avg
    update_interval: 2s
    internal: true
    filters:
      - lambda: |-
          static house_steam::Signal signal;
          id(steam_voltage) = x;
          id(steam_state) = signal.update(x, id(steam_threshold).state, millis());
          return signal.score();
    on_value:
      then:
        - if:
            condition:
              binary_sensor.is_on: gloria_near
            then:
              - mqtt.publish:
                  topic: vintos/board/house-steam/steam
                  payload: !lambda 'return str_sprintf("%.0f", x);'

binary_sensor:
  - platform: template
    id: gloria_near
    name: "Gloria within 1 m"
    lambda: 'return (int32_t)(id(near_until) - millis()) > 0;'

  - platform: template
    id: steam_on
    name: "Steam"
    lambda: |-
      if (id(steam_state) < 0) return {};
      return id(steam_state) == 1;

  - platform: template
    id: shower_active
    internal: true
    lambda: 'return id(steam_on).has_state() && id(steam_on).state && id(gloria_near).state;'
    on_state:
      then:
        - mqtt.publish:
            topic: vintos/board/house-steam/near
            payload: !lambda 'return x ? "on" : "off";'
    on_press:
      then:
        - mqtt.publish:
            topic: vintos/board/house-steam/event
            payload: steam_start
    on_release:
      then:
        - lambda: 'shower_dac::stop();'
        - mqtt.publish:
            topic: vintos/board/house-steam/event
            payload: steam_end
