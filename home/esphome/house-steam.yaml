# Board 1: steam sensor + little speaker (Gloria, 8 November).
#   Steam sensor  VCC 3V3, GND, SIGNAL GPIO34 (analog in)
#   Speaker amp   red 5V, black GND, white GPIO25 (tone out)
# Everything here only counts when her phone is within 1 m of the board (Gloria: "otherwise it could be some other
# person"). The phone is found by its IRK, as the kitchen and bedroom boards find it; the key is gloria_phone_irk in
# the ESPHome add-on's secrets.yaml, never in this file. Away from her: the board reports nothing and plays nothing.
esphome:
  name: house-steam
  friendly_name: House steam board

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "House Steam Board"

captive_portal:

api:
  encryption:
    key: !secret house_steam_api_key

ota:
  - platform: esphome

logger:

mqtt:
  broker: 192.168.1.91
  discovery: false
  reboot_timeout: 0s
  on_message:
    # He plays a short tune here: an RTTTL string, e.g. "hi:d=8,o=6,b=180:c,e,g". Only with her near.
    - topic: vintos/board/house-steam/play
      then:
        - if:
            condition:
              binary_sensor.is_on: gloria_near
            then:
              - rtttl.play: !lambda 'return x;'

esp32_ble_tracker:
  scan_parameters:
    active: false

globals:
  - id: near_until
    type: uint32_t
    initial_value: '0'

number:
  - platform: template     # her phone's signal at 1 m from this board; set from a real reading, no reflash needed
    id: rssi_at_1m
    name: "Gloria phone signal at 1 m"
    optimistic: true
    min_value: -100
    max_value: -30
    step: 1
    initial_value: -65
    restore_value: true
    unit_of_measurement: dBm
  - platform: template     # steam reading (0-100) above which it counts as steam; set from a real shower/kettle
    id: steam_threshold
    name: "Steam threshold"
    optimistic: true
    min_value: 1
    max_value: 100
    step: 1
    initial_value: 30
    restore_value: true

output:
  - platform: ledc
    pin: GPIO25
    id: speaker_out

rtttl:
  output: speaker_out

sensor:
  - platform: ble_rssi
    irk: !secret gloria_phone_irk
    id: gloria_phone_rssi
    name: "Gloria phone signal"
    filters:
      - median:
          window_size: 3
          send_every: 1
    on_value:
      then:
        - lambda: |-
            float d = pow(10.0f, (id(rssi_at_1m).state - x) / 25.0f);
            if (d <= 1.0f) id(near_until) = millis() + 15000;
        - mqtt.publish_json:
            topic: espresense/devices/gloria-phone/house-steam
            payload: |-
              root["id"] = "gloria-phone";
              root["rssi"] = x;
              root["rssi@1m"] = id(rssi_at_1m).state;
              root["distance"] = pow(10.0f, (id(rssi_at_1m).state - x) / 25.0f);

  - platform: adc
    pin: GPIO34
    id: steam_raw
    attenuation: 12db
    update_interval: 2s
    internal: true
    filters:
      - lambda: return (1.0f - x / 3.3f) * 100.0f;   # wet pads read lower: 0 dry, 100 soaked
    on_value:
      then:
        - if:
            condition:
              binary_sensor.is_on: gloria_near
            then:
              - mqtt.publish:
                  topic: vintos/board/house-steam/steam
                  payload: !lambda 'return str_sprintf("%.0f", x);'

binary_sensor:
  - platform: template
    id: gloria_near
    name: "Gloria within 1 m"
    lambda: 'return (int32_t)(id(near_until) - millis()) > 0;'
    on_state:
      then:
        - mqtt.publish:
            topic: vintos/board/house-steam/near
            payload: !lambda 'return x ? "on" : "off";'

  - platform: template
    id: steam_on
    name: "Steam"
    lambda: 'return id(steam_raw).state > id(steam_threshold).state;'
    filters:
      - delayed_on: 4s       # a splash is not steam
      - delayed_off: 30s
    on_press:
      then:
        - if:
            condition:
              binary_sensor.is_on: gloria_near
            then:
              - mqtt.publish:
                  topic: vintos/board/house-steam/event
                  payload: steam_start
    on_release:
      then:
        - if:
            condition:
              binary_sensor.is_on: gloria_near
            then:
              - mqtt.publish:
                  topic: vintos/board/house-steam/event
                  payload: steam_end
