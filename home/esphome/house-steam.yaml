# Board 1, in the bathroom by the shower: steam sensor + little speaker (Gloria, 8 November).
#   Steam sensor  VCC 3V3, GND, SIGNAL GPIO34 (analog in)
#   Speaker amp   red 5V, black GND, white GPIO25 (the ESP32's own DAC)
# His voice and his songs play on that amp from a URL (a WAV, 16 kHz mono), through shower_dac.h: copy it into the
# same folder as this file. ESPHome itself no longer drives the built-in DAC for audio; shower_dac.h does.
# Everything here only counts when her phone is within 1 m of the board (Gloria: "otherwise it could be some other
# person"). The phone is found by its IRK, as the kitchen and bedroom boards find it; the key is gloria_phone_irk in
# the ESPHome add-on's secrets.yaml, never in this file. Away from her: the board reports nothing and starts nothing.
# Keep the board, amp and speaker out of the spray; only the sensor pad goes where the steam is.
esphome:
  name: house-steam
  friendly_name: House steam board
  includes:
    - shower_dac.h

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    advanced:
      include_builtin_idf_components:   # the DAC driver and the HTTP client, for shower_dac.h
        - esp_driver_dac
        - esp_http_client

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "House Steam Board"

captive_portal:

api:
  encryption:
    key: !secret house_steam_api_key

ota:
  - platform: esphome

logger:

mqtt:
  id: mqtt_client
  broker: 192.168.1.91
  discovery: false
  reboot_timeout: 0s
  on_message:
    # He plays something here: the URL of a WAV, his voice or one of his songs. Only with her near.
    - topic: vintos/board/house-steam/play
      then:
        - if:
            condition:
              binary_sensor.is_on: gloria_near
            then:
              - lambda: 'shower_dac::play(x);'
    - topic: vintos/board/house-steam/stop
      then:
        - lambda: 'shower_dac::stop();'

esp32_ble_tracker:
  scan_parameters:
    active: false

globals:
  - id: near_until
    type: uint32_t
    initial_value: '0'
  - id: was_busy
    type: bool
    initial_value: 'false'

number:
  - platform: template     # her phone's signal at 1 m from this board; set from a real reading, no reflash needed
    id: rssi_at_1m
    name: "Gloria phone signal at 1 m"
    optimistic: true
    min_value: -100
    max_value: -30
    step: 1
    initial_value: -65
    restore_value: true
    unit_of_measurement: dBm
  - platform: template     # steam reading (0-100) above which it counts as steam; set from a real shower
    id: steam_threshold
    name: "Steam threshold"
    optimistic: true
    min_value: 1
    max_value: 100
    step: 1
    initial_value: 30
    restore_value: true

interval:
  # tells house_boards.py when the speaker is free, so the next song can go
  - interval: 1s
    then:
      - lambda: |-
          bool b = shower_dac::busy();
          if (b != id(was_busy)) {
            id(was_busy) = b;
            id(mqtt_client).publish("vintos/board/house-steam/player", b ? "busy" : "idle");
          }

sensor:
  - platform: ble_rssi
    irk: !secret gloria_phone_irk
    id: gloria_phone_rssi
    name: "Gloria phone signal"
    filters:
      - median:
          window_size: 3
          send_every: 1
    on_value:
      then:
        - lambda: |-
            float d = pow(10.0f, (id(rssi_at_1m).state - x) / 25.0f);
            if (d <= 1.0f) id(near_until) = millis() + 15000;
        - mqtt.publish_json:
            topic: espresense/devices/gloria-phone/house-steam
            payload: |-
              root["id"] = "gloria-phone";
              root["rssi"] = x;
              root["rssi@1m"] = id(rssi_at_1m).state;
              root["distance"] = pow(10.0f, (id(rssi_at_1m).state - x) / 25.0f);

  - platform: adc
    pin: GPIO34
    id: steam_raw
    attenuation: 12db
    update_interval: 2s
    internal: true
    filters:
      - lambda: return (1.0f - x / 3.3f) * 100.0f;   # wet pads read lower: 0 dry, 100 soaked
    on_value:
      then:
        - if:
            condition:
              binary_sensor.is_on: gloria_near
            then:
              - mqtt.publish:
                  topic: vintos/board/house-steam/steam
                  payload: !lambda 'return str_sprintf("%.0f", x);'

binary_sensor:
  - platform: template
    id: gloria_near
    name: "Gloria within 1 m"
    lambda: 'return (int32_t)(id(near_until) - millis()) > 0;'
    on_state:
      then:
        - mqtt.publish:
            topic: vintos/board/house-steam/near
            payload: !lambda 'return x ? "on" : "off";'

  - platform: template
    id: steam_on
    name: "Steam"
    lambda: 'return id(steam_raw).state > id(steam_threshold).state;'
    filters:
      - delayed_on: 4s       # a splash is not steam
      - delayed_off: 30s
    on_press:
      then:
        - if:
            condition:
              binary_sensor.is_on: gloria_near
            then:
              - mqtt.publish:
                  topic: vintos/board/house-steam/event
                  payload: steam_start
    on_release:
      then:
        - lambda: 'shower_dac::stop();'     # the shower is over: whatever he was playing stops
        - mqtt.publish:
            topic: vintos/board/house-steam/event
            payload: steam_end
