# Board 2: pressure strip + mic (Gloria, 8 November).
#   Mic module      VCC 3V3, GND, SIGNAL GPIO34 (analog in)
#   Pressure strip  tail 1 GPIO33 (driven HIGH to power it), tail 2 GPIO32 (ADC with pull-down; calibrated body-weight thresholds)
# The mic gives a loudness number only. The board never records or sends sound, only how loud it is.
# Everything here only counts when her phone is within 1 m of the board (IRK, as the kitchen board; the key is
# gloria_phone_irk in the ESPHome add-on's secrets.yaml). Away from her: the board reports nothing.
esphome:
  name: house-press-mic
  friendly_name: House pressure + mic board
  includes:
    - mic_meter.h
    - mic_statistics.h
    - pressure_gate.h
  on_boot:
    priority: 600             # GPIO output setup runs at 800 and initially turns the pin off.
    then:
      - output.turn_on: strip_power   # GPIO33 HIGH powers the strip
      - lambda: 'house_mic::begin();'

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "House Press Mic Board"

captive_portal:

api:
  encryption:
    key: !secret house_press_mic_api_key

ota:
  - platform: esphome

logger:
  baud_rate: 0  # Keep physical UART quiet; encrypted API logs remain available.

mqtt:
  broker: 192.168.1.91
  discovery: false
  reboot_timeout: 0s

esp32_ble_tracker:
  scan_parameters:
    active: false

globals:
  - id: near_until
    type: uint32_t
    initial_value: '0'

number:
  - platform: template
    id: pressure_on_threshold
    name: "Pressure occupied threshold"
    entity_category: config
    optimistic: true
    min_value: 0
    max_value: 100
    step: 0.5
    initial_value: 95
    restore_value: true
    unit_of_measurement: "%"
  - platform: template
    id: pressure_off_threshold
    name: "Pressure release threshold"
    entity_category: config
    optimistic: true
    min_value: 0
    max_value: 100
    step: 0.5
    initial_value: 90
    restore_value: true
    unit_of_measurement: "%"
  - platform: template
    id: rssi_at_1m
    name: "Gloria phone signal at 1 m"
    optimistic: true
    min_value: -100
    max_value: -30
    step: 1
    initial_value: -65
    restore_value: true
    unit_of_measurement: dBm

output:
  - platform: gpio
    pin: GPIO33
    id: strip_power

sensor:
  - platform: template
    id: pressure_level
    name: "Pressure level"
    entity_category: diagnostic
    unit_of_measurement: "%"
    accuracy_decimals: 2
    update_interval: 250ms
    lambda: |-
      return house_mic::pressure_level();
    filters:
      - median:
          window_size: 3
          send_every: 1
          send_first_at: 1

  - platform: ble_rssi
    irk: !secret gloria_phone_irk
    id: gloria_phone_rssi
    name: "Gloria phone signal"
    filters:
      - median:
          window_size: 3
          send_every: 1
    on_value:
      then:
        - lambda: |-
            float d = pow(10.0f, (id(rssi_at_1m).state - x) / 25.0f);
            if (d <= 1.0f) id(near_until) = millis() + 15000;
        - mqtt.publish_json:
            topic: espresense/devices/gloria-phone/house-press-mic
            payload: |-
              root["id"] = "gloria-phone";
              root["rssi"] = x;
              root["rssi@1m"] = id(rssi_at_1m).state;
              root["distance"] = pow(10.0f, (id(rssi_at_1m).state - x) / 25.0f);

  # Continuous ADC sampling; only DC-independent RMS amplitude is published.
  - platform: template
    id: loudness
    name: "Loudness"
    update_interval: 1s
    accuracy_decimals: 1
    lambda: 'return house_mic::level();'
    on_value:
      then:
        - if:
            condition:
              and:
                - binary_sensor.is_on: gloria_near
                - lambda: return std::isfinite(x);
            then:
              - mqtt.publish:
                  topic: vintos/board/house-press-mic/loudness
                  payload: !lambda 'return str_sprintf("%.1f", x);'

binary_sensor:
  - platform: template
    id: gloria_near
    name: "Gloria within 1 m"
    lambda: 'return (int32_t)(id(near_until) - millis()) > 0;'
    on_state:
      then:
        - mqtt.publish:
            topic: vintos/board/house-press-mic/near
            payload: !lambda 'return x ? "on" : "off";'

  - platform: template
    id: pressed
    name: "Pressure"
    lambda: |-
      static house_pressure::Gate gate(1000, 1500);
      float level = id(pressure_level).state;
      if (!std::isfinite(house_mic::pressure_level())) level = NAN;
      int state = gate.update(level, id(pressure_on_threshold).state,
                              id(pressure_off_threshold).state, millis());
      if (state < 0) {
        id(pressed).invalidate_state();
        return {};
      }
      return state != 0;
    on_press:
      then:
        - if:
            condition:
              binary_sensor.is_on: gloria_near
            then:
              - mqtt.publish: {topic: vintos/board/house-press-mic/event, payload: press_start}
    on_release:
      then:
        - if:
            condition:
              binary_sensor.is_on: gloria_near
            then:
              - mqtt.publish: {topic: vintos/board/house-press-mic/event, payload: press_end}
    # Squeeze codes she can send him on purpose.
    on_multi_click:
      - timing:
          - ON for at most 0.6s
          - OFF for at most 0.5s
          - ON for at most 0.6s
          - OFF for at least 0.6s
        then:
          - if:
              condition:
                binary_sensor.is_on: gloria_near
              then:
                - mqtt.publish: {topic: vintos/board/house-press-mic/event, payload: double_squeeze}
      - timing:
          - ON for at least 3s
        then:
          - if:
              condition:
                binary_sensor.is_on: gloria_near
              then:
                - mqtt.publish: {topic: vintos/board/house-press-mic/event, payload: long_hold}
