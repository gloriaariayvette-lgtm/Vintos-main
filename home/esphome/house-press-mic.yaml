# Board 2: pressure strip + mic (Gloria, 8 November).
#   Mic module      VCC 3V3, GND, SIGNAL GPIO34 (analog in)
#   Pressure strip  tail 1 GPIO33 (driven HIGH to power it), tail 2 GPIO32 (INPUT_PULLDOWN)
# The mic gives a loudness number only. The board never records or sends sound, only how loud it is.
# Everything here only counts when her phone is within 1 m of the board (IRK, as the kitchen board; the key is
# gloria_phone_irk in the ESPHome add-on's secrets.yaml). Away from her: the board reports nothing.
esphome:
  name: house-press-mic
  friendly_name: House pressure + mic board
  on_boot:
    - priority: 800
      then:
        - output.turn_on: strip_power   # GPIO33 HIGH powers the strip
    - priority: -100
      then:
      - lambda: 'gpio_pulldown_en(GPIO_NUM_32); gpio_pullup_dis(GPIO_NUM_32);'   # the strip's pull-down, kept while read as a level

esp32:
  board: esp32dev
  framework:
    type: arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "House Press Mic Board"

captive_portal:

api:
  encryption:
    key: !secret house_press_mic_api_key

ota:
  - platform: esphome

logger:

mqtt:
  broker: 192.168.1.91
  discovery: false
  reboot_timeout: 0s

esp32_ble_tracker:
  scan_parameters:
    active: false

globals:
  - id: near_until
    type: uint32_t
    initial_value: '0'

number:
  - platform: template     # the pressure level (0-100) above which someone is sitting; set from real readings
    id: pressure_threshold
    name: "Pressure threshold"
    optimistic: true
    min_value: 1
    max_value: 100
    step: 1
    initial_value: 50
    restore_value: true
  - platform: template
    id: rssi_at_1m
    name: "Gloria phone signal at 1 m"
    optimistic: true
    min_value: -100
    max_value: -30
    step: 1
    initial_value: -65
    restore_value: true
    unit_of_measurement: dBm

output:
  - platform: gpio
    pin: GPIO33
    id: strip_power

sensor:
  # The strip read as a level, not on/off: at rest these strips still pass enough current to read as pressed
  # on a plain digital pin (8 November: the sofa read pressed with no one on it). 0 = nothing, 100 = hard press.
  - platform: adc
    pin: GPIO32
    id: pressure_level
    name: "Pressure level"
    attenuation: 12db
    update_interval: 250ms
    filters:
      - lambda: return x / 3.3f * 100.0f;
      - sliding_window_moving_average:
          window_size: 4
          send_every: 1
      - delta: 2.0
  - platform: ble_rssi
    irk: !secret gloria_phone_irk
    id: gloria_phone_rssi
    name: "Gloria phone signal"
    filters:
      - median:
          window_size: 3
          send_every: 1
    on_value:
      then:
        - lambda: |-
            float d = pow(10.0f, (id(rssi_at_1m).state - x) / 25.0f);
            if (d <= 1.0f) id(near_until) = millis() + 15000;
        - mqtt.publish_json:
            topic: espresense/devices/gloria-phone/house-press-mic
            payload: |-
              root["id"] = "gloria-phone";
              root["rssi"] = x;
              root["rssi@1m"] = id(rssi_at_1m).state;
              root["distance"] = pow(10.0f, (id(rssi_at_1m).state - x) / 25.0f);

  # Loudness: the swing of the mic signal over ~40 ms, 0-100. Not sound, just how loud.
  - platform: template
    id: loudness
    name: "Loudness"
    update_interval: 1s
    lambda: |-
      int lo = 4095, hi = 0;
      for (int i = 0; i < 400; i++) {
        int v = analogRead(34);
        if (v < lo) lo = v;
        if (v > hi) hi = v;
        delayMicroseconds(100);
      }
      return (hi - lo) * 100.0f / 4095.0f;
    on_value:
      then:
        - if:
            condition:
              binary_sensor.is_on: gloria_near
            then:
              - mqtt.publish:
                  topic: vintos/board/house-press-mic/loudness
                  payload: !lambda 'return str_sprintf("%.0f", x);'

binary_sensor:
  - platform: template
    id: gloria_near
    name: "Gloria within 1 m"
    lambda: 'return (int32_t)(id(near_until) - millis()) > 0;'
    on_state:
      then:
        - mqtt.publish:
            topic: vintos/board/house-press-mic/near
            payload: !lambda 'return x ? "on" : "off";'
        - if:
            condition:
              lambda: 'return x && id(pressed).state;'
            then:
              - mqtt.publish: {topic: vintos/board/house-press-mic/event, payload: press_start}

  - platform: template
    id: pressed
    name: "Pressure"
    lambda: 'return id(pressure_level).state > id(pressure_threshold).state;'
    filters:
      - delayed_on: 50ms
      - delayed_off: 300ms
    on_press:
      then:
        - if:
            condition:
              binary_sensor.is_on: gloria_near
            then:
              - mqtt.publish: {topic: vintos/board/house-press-mic/event, payload: press_start}
    on_release:
      then:
        - if:
            condition:
              binary_sensor.is_on: gloria_near
            then:
              - mqtt.publish: {topic: vintos/board/house-press-mic/event, payload: press_end}
    # Squeeze codes she can send him on purpose.
    on_multi_click:
      - timing:
          - ON for at most 0.6s
          - OFF for at most 0.5s
          - ON for at most 0.6s
          - OFF for at least 0.6s
        then:
          - if:
              condition:
                binary_sensor.is_on: gloria_near
              then:
                - mqtt.publish: {topic: vintos/board/house-press-mic/event, payload: double_squeeze}
      - timing:
          - ON for at least 3s
        then:
          - if:
              condition:
                binary_sensor.is_on: gloria_near
              then:
                - mqtt.publish: {topic: vintos/board/house-press-mic/event, payload: long_hold}
