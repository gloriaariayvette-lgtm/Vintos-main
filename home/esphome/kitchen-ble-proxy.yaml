# The kitchen ESP32: a Bluetooth proxy, so Home Assistant can reach the Fingerbot Pro on the Nespresso
# (bought 17 October; Bluetooth only). Flash it once from Home Assistant's ESPHome add-on; plug it in by the machine.
# Wi-Fi and the API key come from the ESPHome add-on's own secrets.yaml, never from this file.
esphome:
  name: kitchen-ble-proxy
  friendly_name: Kitchen BLE proxy

esp32:
  board: esp32dev          # most plain ESP32 dev boards; for an ESP32-S3 or -C3 board pick that board instead
  framework:
    type: esp-idf          # the Bluetooth proxy wants ESP-IDF, not Arduino

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # If it cannot join that network it opens its own hotspot, "Kitchen BLE Proxy": join it from a phone, a page
  # lists the networks it can see, pick the house Wi-Fi and type its password. The bedroom ESP32 (ESPresense) is set
  # up the same way. No network name or password has to be known in advance (25 October).
  ap:
    ssid: "Kitchen BLE Proxy"

captive_portal:

api:
  encryption:
    key: !secret kitchen_proxy_api_key

ota:
  - platform: esphome

logger:

esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true             # active: Home Assistant can connect through it and press, not only listen

# Her phone, heard here, is her in the kitchen (Gloria, 3 November: "let the coffee maker esp32 know when I pass within
# 1m"). The phone is found by its IRK, as the bedroom board finds it; the key is gloria_phone_irk in secrets.yaml, never
# in this file. Each reading goes to the Mosquitto relay on the Mac in the bedroom board's form, where
# scripts/kitchen_presence.py on Aegis takes within 1 m as the kitchen. Home Assistant is not needed for this.
mqtt:
  broker: 192.168.1.91
  discovery: false         # Home Assistant already has this board through the API
  reboot_timeout: 0s       # the Mac being off must never restart the Fingerbot's proxy

number:
  - platform: template     # her phone's signal at 1 m from the board; set from a real reading, no reflash needed
    id: rssi_at_1m
    name: "Gloria phone signal at 1 m"
    optimistic: true
    min_value: -100
    max_value: -30
    step: 1
    initial_value: -65
    restore_value: true
    unit_of_measurement: dBm

sensor:
  - platform: ble_rssi
    irk: !secret gloria_phone_irk
    id: gloria_phone_rssi
    name: "Gloria phone signal"
    filters:
      - median:
          window_size: 3
          send_every: 1
    on_value:
      then:
        - mqtt.publish_json:
            topic: espresense/devices/gloria-phone/kitchen
            payload: |-
              root["id"] = "gloria-phone";
              root["rssi"] = x;
              root["rssi@1m"] = id(rssi_at_1m).state;
              root["distance"] = pow(10.0f, (id(rssi_at_1m).state - x) / 25.0f);
