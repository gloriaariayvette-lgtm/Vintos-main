<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atelier · Forge</title>
<style>body{font:17px system-ui;max-width:850px;margin:3rem auto;padding:0 1rem;background:#171c20;color:#ebeeeb}input,textarea,button{font:inherit;padding:.6rem;margin:.25rem;border:1px solid #707b80;border-radius:6px;background:#242e34;color:inherit}textarea{display:block;width:90%;min-height:7rem}article{border-top:1px solid #657575;padding:1rem 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#bfcdca}button{cursor:pointer}#error{color:#ffd3a4}</style>
<h1>Forge in the Atelier</h1><p>Work continues until it is complete or you cancel. Private work stays covered until reveal, expiry, or an explicit audit.</p>
<label>Owner key <input id="key" type="password" autocomplete="off"></label><button id="connect">Open controls</button><p id="error" role="status"></p>
<section id="controls" hidden><h2>Begin a project</h2><textarea id="intent" placeholder="What should this report explore or make?"></textarea><label><input id="private" type="checkbox"> Private creation interval</label><label>Until <input id="until" type="datetime-local"></label><p><small>Local report creation. Paid tools and wallet operations are unavailable.</small></p><button id="create">Begin</button><button id="refresh">Refresh</button><div id="projects"></div></section>
<script>
const $=id=>document.getElementById(id);let token='';
async function api(path,method='GET',body){const r=await fetch(path,{method,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');return data}
function button(label,fn){const b=document.createElement('button');b.textContent=label;b.onclick=()=>run(fn);return b}
async function run(fn){$('error').textContent='';try{await fn()}catch(e){$('error').textContent=e.message}}
async function refresh(){const rows=await api('/api/projects');$('projects').replaceChildren();for(const p of rows){const a=document.createElement('article'),h=document.createElement('h3'),pre=document.createElement('pre');h.textContent=p.id+' · '+p.state+(p.private?' · private':'');a.append(h);const text=document.createElement('p');text.textContent=p.cycles+' cycles retained';a.append(text);
const base='/api/projects/'+p.id;
a.append(button('Cancel next cycle',async()=>{await api(base+'/cancel','POST',{});await refresh()}));
if(p.private)a.append(button('Audit and end private interval',async()=>{if(confirm('End this private interval and open its retained work?'))pre.textContent=JSON.stringify(await api(base+'/audit','POST',{}),null,2)}));
else a.append(button('Read retained work',async()=>{const rows=await api(base+'/artifacts');pre.textContent=JSON.stringify(rows.map(x=>({...x,artifact:x.artifact?JSON.parse(x.artifact):null})),null,2)}));
a.append(pre);$('projects').append(a)}}
$('connect').onclick=()=>run(async()=>{token=$('key').value;$('key').value='';await refresh();$('controls').hidden=false});$('refresh').onclick=()=>run(refresh);
$('create').onclick=()=>run(async()=>{const private=$('private').checked;const until=$('until').value;await api('/api/projects','POST',{intent:$('intent').value,private,private_until:private&&until?Date.parse(until)/1000:null});$('intent').value='';await refresh()});
</script></html>
